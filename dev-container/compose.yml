name: dev_container
x-podman:
  in_pod: false
services:
  dev_container:
    image: dev:latest
    container_name: dev_container
    userns_mode: keep-id
    security_opt:
      - label=disable
    restart: on-failure
    command: micromamba run -n dev jupyter lab
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      PLANNOTATOR_REMOTE: 1
      PLANNOTATOR_PORT: 8889
      PLANNOTATOR_SHARE: disabled
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
    volumes:
      - .:/work
      - dev-antigen:/home/user/.antigen

volumes:
  dev-antigen:
    name: dev-antigen
